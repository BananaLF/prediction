[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predmarket"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
    "websockets>=12,<16",
]

[project.optional-dependencies]
test = [
    "hypothesis>=6,<7",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
]

[project.scripts]
predmarket = "predmarket.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
